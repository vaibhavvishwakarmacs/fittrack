<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitTrack" />
    <meta name="description" content="FitTrack is an installable, mobile-first fitness tracker for workouts, nutrition, daily activity, and body metrics." />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />

    <!-- Google Fonts: Outfit for dynamic headings & Inter for crisp UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <title>FitTrack — Mobile-First Fitness Tracker</title>
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        background: #090a0f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .splash-glow {
        position: absolute;
        width: 240px;
        height: 240px;
        background: rgba(204, 255, 0, 0.12);
        border-radius: 9999px;
        filter: blur(48px);
        pointer-events: none;
      }
      .splash-card {
        position: relative;
        width: 96px;
        height: 96px;
        background: #11141d;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 24px rgba(204, 255, 0, 0.15);
        animation: splashPulse 1.8s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.92; }
      }
      .splash-title {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #ffffff;
        font-family: 'Outfit', 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .splash-badge {
        font-size: 10px;
        font-weight: 900;
        padding: 2px 6px;
        border-radius: 4px;
        background: #ccff00;
        color: #090a0f;
        letter-spacing: 0.05em;
      }
      .splash-bar {
        width: 110px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        margin-top: 20px;
        overflow: hidden;
      }
      .splash-bar-inner {
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, #ccff00, #84cc16);
        border-radius: 9999px;
        animation: splashBarMove 1.2s ease-in-out infinite;
      }
      @keyframes splashBarMove {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="bg-dark-950 text-white font-sans antialiased selection:bg-lime selection:text-black min-h-screen">
    <div id="root">
      <div id="pwa-splash">
        <div class="splash-glow"></div>
        <div class="splash-card">
          <svg viewBox="0 0 512 512" width="100%" height="100%">
            <defs>
              <linearGradient id="idxLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ccff00" />
                <stop offset="100%" stop-color="#84cc16" />
              </linearGradient>
            </defs>
            <g transform="translate(64, 64) scale(0.75)">
              <rect x="60" y="140" width="40" height="232" rx="16" fill="url(#idxLimeGrad)" />
              <rect x="110" y="180" width="30" height="152" rx="12" fill="url(#idxLimeGrad)" />
              <rect x="140" y="236" width="232" height="40" rx="8" fill="#ffffff" />
              <path d="M 230 190 L 290 256 L 250 266 L 285 330 L 220 260 L 255 250 Z" fill="url(#idxLimeGrad)" />
              <rect x="372" y="180" width="30" height="152" rx="12" fill="url(#idxLimeGrad)" />
              <rect x="412" y="140" width="40" height="232" rx="16" fill="url(#idxLimeGrad)" />
            </g>
          </svg>
        </div>
        <div class="splash-title">
          <span>FitTrack</span>
          <span class="splash-badge">PRO</span>
        </div>
        <div class="splash-bar">
          <div class="splash-bar-inner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
